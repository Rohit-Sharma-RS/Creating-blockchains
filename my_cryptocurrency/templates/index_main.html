<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipcoin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .alert-container {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            z-index: 1050;
        }

        .block-info {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .block-info pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>

<body>
    <!-- Alert Container -->
    <div id="alertContainer" class="alert-container"></div>

    <div class="container mt-5">
        <h1 class="text-center">
            <img src="../static/pipcoin.png" alt="logo" style="height: 50px; margin-right: 10px;">
            Pipcoin Transactions
        </h1>

        <!-- Add Transaction Form -->
        <div class="card mt-4">
            <div class="card-body">
                <h3 class="card-title">Add a Pipcoin Transaction</h3>
                <form id="transactionForm">
                    <div class="mb-3">
                        <label for="sender" class="form-label">Sender</label>
                        <input type="text" class="form-control" id="sender" placeholder="Enter sender's name" required>
                    </div>
                    <div class="mb-3">
                        <label for="receiver" class="form-label">Receiver</label>
                        <input type="text" class="form-control" id="receiver" placeholder="Enter receiver's name" required>
                    </div>
                    <div class="mb-3">
                        <label for="amount" class="form-label">Amount</label>
                        <input type="number" class="form-control" id="amount" placeholder="Enter amount" required>
                    </div>
                    <button type="button" class="btn btn-primary" id="addTransaction">
                        <i class="bi bi-plus-circle"></i> Add Transaction
                    </button>
                </form>
            </div>
        </div>

        <!-- Blockchain Actions -->
        <div class="text-center mt-4">
            <button class="btn btn-success me-2" id="mineBlock">
                <i class="bi bi-hammer"></i> Mine Block
            </button>
            <button class="btn btn-info me-2" id="viewChain" data-bs-toggle="modal" data-bs-target="#viewChainModal">
                <i class="bi bi-link-45deg"></i> View Blockchain
            </button>
            <button class="btn btn-warning" id="validateChain">
                <i class="bi bi-shield-check"></i> Validate Blockchain
            </button>
        </div>

        <!-- Blockchain Data Modal -->
        <div class="modal fade" id="viewChainModal" tabindex="-1" aria-labelledby="viewChainModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="viewChainModalLabel">Blockchain Data</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="blockchainData" class="bg-light p-3 rounded" style="max-height: 500px; overflow-y: auto;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Output Section -->
        <div class="mt-4" id="output"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showAlert(message, type) {
            const alertContainer = document.getElementById("alertContainer");
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
            setTimeout(() => {
                const alert = document.querySelector(".alert");
                if (alert) alert.remove();
            }, 3000);
        }

        // Add Transaction
        document.getElementById("addTransaction").addEventListener("click", () => {
            const sender = document.getElementById("sender").value;
            const receiver = document.getElementById("receiver").value;
            const amount = document.getElementById("amount").value;

            fetch("/add_transaction", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ sender, receiver, amount }),
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("sender").value = "";
                document.getElementById("receiver").value = "";
                document.getElementById("amount").value = "";
                showAlert(data.message, "success");
            });
        });

        // Mine Block
        document.getElementById("mineBlock").addEventListener("click", () => {
            const outputElement = document.getElementById("output");

    // Show mining status
    outputElement.innerHTML = `
        <div class="text-center my-3">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Mining in progress...</span>
            </div>
            <p>Mining in progress...</p>
        </div>
    `;
            fetch("/mine_block")
                .then(response => response.json())
                .then(data => {
                    showAlert("Block mined successfully!", "success");
                    const outputDiv = document.getElementById("output");
                    outputDiv.innerHTML = `
                        <div class="block-info">
                            <h4>Block Mined Successfully!</h4>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                })
                .catch(error => {
                    showAlert("Failed to mine block. Check the server.", "danger");
                    console.error(error);
                });
        });

        // View Blockchain
        document.getElementById("viewChain").addEventListener("click", () => {
            fetch("/get_chain")
                .then(response => response.json())
                .then(data => {
                    const chainHTML = data.chain.map(block => `
                        <div class="card mb-3">
                            <div class="card-header">Block ${block.index}</div>
                            <div class="card-body">
                                <p><strong>Timestamp:</strong> ${block.timestamp}</p>
                                <p><strong>Proof:</strong> ${block.proof}</p>
                                <p><strong>Previous Hash:</strong> ${block.previous_hash}</p>
                                <p><strong>Transactions:</strong> ${JSON.stringify(block.transactions, null, 2)}</p>
                            </div>
                        </div>
                    `).join("");
                    document.getElementById("blockchainData").innerHTML = chainHTML;
                });
        });

        // Validate Blockchain
        document.getElementById("validateChain").addEventListener("click", () => {
            fetch("/is_valid")
                .then(response => response.json())
                .then(data => {
                    const alertType = data.message.includes("valid") ? "success" : "danger";
                    showAlert(data.message, alertType);
                });
        });
    </script>
</body>

</html>
